<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade 6 ICT - Team Quiz Challenge (50 Qs - Shuffled)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; position: relative; }
    
    /* Top Header & Scoreboard */
    header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 15px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); margin-bottom: 20px; border: 1px solid #334155; flex-wrap: wrap; gap: 12px; }
    .game-title { font-size: 1.4rem; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .q-counter { font-size: 1.1rem; background: #334155; padding: 6px 18px; border-radius: 20px; font-weight: 600; color: #f1f5f9; }
    
    /* Scoreboard & Team Cards */
    .scoreboard { display: flex; gap: 12px; flex-wrap: wrap; }
    .team-card { background: #0f172a; padding: 8px 12px; border-radius: 12px; border: 1px solid #475569; text-align: center; min-width: 110px; display: flex; flex-direction: column; justify-content: space-between; }
    .team-header { display: flex; justify-content: center; align-items: center; gap: 4px; }
    .team-name { font-size: 0.85rem; color: #38bdf8; font-weight: bold; text-transform: uppercase; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rename-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.75rem; }
    .rename-btn:hover { color: #f59e0b; }
    .team-score { font-size: 1.4rem; font-weight: bold; color: #f59e0b; margin: 2px 0; }
    .score-controls { display: flex; justify-content: center; gap: 4px; }
    .score-btn { background: #334155; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .score-btn:hover { background: #475569; }

    /* Main Question Box */
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1200px; margin: 0 auto; width: 100%; }
    .round-badge { align-self: center; background: #8b5cf6; color: #fff; padding: 6px 22px; border-radius: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); }
    
    .question-box { background: #1e293b; padding: 35px 30px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(0,0,0,0.4); margin-bottom: 25px; border: 2px solid #334155; min-height: 140px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 1.85rem; font-weight: 700; line-height: 1.35; color: #f8fafc; }

    /* Options Grid (Kahoot Theme) */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .option-card { padding: 22px 20px; border-radius: 16px; display: flex; align-items: center; font-size: 1.35rem; font-weight: 600; cursor: pointer; transition: transform 0.15s ease, opacity 0.3s ease; box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
    .option-card:hover { transform: translateY(-3px); }
    
    .shape { font-size: 2rem; margin-right: 18px; opacity: 0.95; }
    .opt-a { background-color: #e21b3c; color: white; }
    .opt-b { background-color: #1368ce; color: white; }
    .opt-c { background-color: #d89e00; color: white; }
    .opt-d { background-color: #26890c; color: white; }

    .dimmed { opacity: 0.2; transform: scale(0.98); }
    .correct-answer { transform: scale(1.03); outline: 4px solid #ffffff; box-shadow: 0 0 35px rgba(255,255,255,0.8); animation: pulse 1s infinite alternate; }

    @keyframes pulse {
      from { box-shadow: 0 0 15px rgba(255,255,255,0.4); }
      to { box-shadow: 0 0 35px rgba(255,255,255,0.95); }
    }

    /* Footer Controls */
    footer { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; width: 100%; background: #1e293b; padding: 15px 25px; border-radius: 16px; border: 1px solid #334155; flex-wrap: wrap; gap: 10px; }
    .control-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-nav { background: #475569; color: white; }
    .btn-nav:hover { background: #64748b; }
    .btn-reveal { background: #f59e0b; color: #0f172a; font-size: 1.25rem; padding: 12px 36px; }
    .btn-reveal:hover { background: #d97706; }
    .btn-finish { background: #ec4899; color: white; }
    .btn-finish:hover { background: #db2777; }

    /* Winner Popup Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #1e293b; border: 3px solid #f59e0b; border-radius: 24px; padding: 40px; text-align: center; max-width: 650px; width: 90%; box-shadow: 0 25px 50px rgba(0,0,0,0.6); animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    
    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .trophy-icon { font-size: 4.5rem; margin-bottom: 10px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
    
    .winner-title { font-size: 2.2rem; color: #f59e0b; font-weight: bold; margin-bottom: 8px; }
    .winner-subtitle { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 25px; }
    .leaderboard-list { margin-bottom: 30px; text-align: left; background: #0f172a; border-radius: 16px; padding: 15px 20px; border: 1px solid #334155; }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: 600; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-1 { color: #f59e0b; }
    .rank-2 { color: #94a3b8; }
    .rank-3 { color: #b45309; }
    .rank-4 { color: #64748b; }

    @media (max-width: 768px) {
      .options-grid { grid-template-columns: 1fr; }
      .question-text { font-size: 1.4rem; }
      .option-card { font-size: 1.1rem; padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Header with Scoreboard & Team Rename -->
  <header>
    <div class="game-title">🎮 Grade 6 ICT Team Challenge</div>
    <div class="q-counter" id="q-counter">Question 1 / 50</div>
    <div class="scoreboard">
      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-0">Team A</span>
          <button class="rename-btn" onclick="renameTeam(0)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-0">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(0, 100)">+100</button>
          <button class="score-btn" onclick="addScore(0, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-1">Team B</span>
          <button class="rename-btn" onclick="renameTeam(1)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-1">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(1, 100)">+100</button>
          <button class="score-btn" onclick="addScore(1, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-2">Team C</span>
          <button class="rename-btn" onclick="renameTeam(2)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-2">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(2, 100)">+100</button>
          <button class="score-btn" onclick="addScore(2, -50)">-50</button>
        </div>
      </div>

      <div class="team-card">
        <div class="team-header">
          <span class="team-name" id="tname-3">Team D</span>
          <button class="rename-btn" onclick="renameTeam(3)" title="Rename Team">✏️</button>
        </div>
        <div class="team-score" id="score-3">0</div>
        <div class="score-controls">
          <button class="score-btn" onclick="addScore(3, 100)">+100</button>
          <button class="score-btn" onclick="addScore(3, -50)">-50</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Question Box -->
  <main>
    <div class="round-badge" id="round-badge">Unit 1: Importance of Computers</div>
    <div class="question-box">
      <div class="question-text" id="question-text">Loading Question...</div>
    </div>

    <div class="options-grid">
      <div class="option-card opt-a" id="opt-0" onclick="revealAnswer()">
        <span class="shape">▲</span><span id="opt-text-0">Option A</span>
      </div>
      <div class="option-card opt-b" id="opt-1" onclick="revealAnswer()">
        <span class="shape">◆</span><span id="opt-text-1">Option B</span>
      </div>
      <div class="option-card opt-c" id="opt-2" onclick="revealAnswer()">
        <span class="shape">●</span><span id="opt-text-2">Option C</span>
      </div>
      <div class="option-card opt-d" id="opt-3" onclick="revealAnswer()">
        <span class="shape">■</span><span id="opt-text-3">Option D</span>
      </div>
    </div>
  </main>

  <!-- Control Buttons -->
  <footer>
    <button class="control-btn btn-nav" onclick="prevQuestion()">◄ Previous</button>
    <button class="control-btn btn-reveal" onclick="revealAnswer()">Show Answer 👁️</button>
    <button class="control-btn btn-finish" onclick="showWinnerModal()">Finish Game 🏆</button>
    <button class="control-btn btn-nav" onclick="nextQuestion()">Next Question ►</button>
  </footer>

  <!-- Winner Pop-up Modal -->
  <div class="modal-overlay" id="winner-modal">
    <div class="modal-content">
      <div class="trophy-icon">🏆</div>
      <div class="winner-title" id="winner-headline">CHAMPIONS!</div>
      <div class="winner-subtitle" id="winner-subtext">Great job Grade 6 ICT students!</div>
      <div class="leaderboard-list" id="leaderboard-body"></div>
      <button class="control-btn btn-reveal" onclick="closeWinnerModal()">Close & Continue</button>
    </div>
  </div>

  <script>
    // 50 SIMPLE QUESTIONS FROM GRADE 6 ICT SYLLABUS (SHUFFLED POSITIONS + AUTO-SHUFFLE ON LOAD)
    const rawQuestions = [
      // --- UNIT 1: IMPORTANCE OF COMPUTERS (9 Qs) ---
      { round: "Unit 1: Importance of Computers", q: "What are the three main tasks of a computer?", opts: ["Type, Print, Draw", "Play, Sleep, Eat", "Input, Process, Output", "Save, Copy, Paste"], ans: 2 },
      { round: "Unit 1: Importance of Computers", q: "Which feature means a computer can do many tasks very fast?", opts: ["Laziness", "Speed and Efficiency", "Guessing", "Sleeping"], ans: 1 },
      { round: "Unit 1: Importance of Computers", q: "Can a computer think and take decisions by itself like a human?", opts: ["Yes, always", "Only on Sundays", "Only when playing games", "No, it follows given instructions"], ans: 3 },
      { round: "Unit 1: Importance of Computers", q: "Which of these has an embedded computer system?", opts: ["Washing machine", "Wooden chair", "Pencil", "Stone"], ans: 0 },
      { round: "Unit 1: Importance of Computers", q: "Where is the Central Processing Unit (CPU) kept in a desktop computer?", opts: ["On the keyboard", "Inside the system unit", "Inside the mouse", "On the wall"], ans: 1 },
      { round: "Unit 1: Importance of Computers", q: "Which device is used to enter data into a computer?", opts: ["Monitor", "Printer", "Keyboard", "Speaker"], ans: 2 },
      { round: "Unit 1: Importance of Computers", q: "Which device shows output as pictures and text on a screen?", opts: ["Mouse", "Scanner", "Barcode reader", "Monitor"], ans: 3 },
      { round: "Unit 1: Importance of Computers", q: "Which of these is a storage device?", opts: ["Microphone", "Pen drive", "Web camera", "Router"], ans: 1 },
      { round: "Unit 1: Importance of Computers", q: "Who is a 'user' of a computer?", opts: ["A computer cable", "A game character", "The person who uses the computer", "A screen icon"], ans: 2 },

      // --- UNIT 2: USE THE COMPUTER LABORATORY SAFELY (9 Qs) ---
      { round: "Unit 2: Computer Lab Safety", q: "What should you do with your shoes before entering the computer lab?", opts: ["Wear them on the desk", "Put them on the chair", "Leave them near the monitor", "Remove them outside"], ans: 3 },
      { round: "Unit 2: Computer Lab Safety", q: "Why should we not bring food or water into the computer lab?", opts: ["They can spill and damage devices", "They make the mouse heavy", "They block the Wi-Fi", "They turn off the lights"], ans: 0 },
      { round: "Unit 2: Computer Lab Safety", q: "What is the first step when turning on a desktop computer?", opts: ["Open a game", "Switch on the wall power socket", "Press the monitor button twice", "Unplug the mouse"], ans: 1 },
      { round: "Unit 2: Computer Lab Safety", q: "What is the correct order to turn off a computer safely?", opts: ["Pull out the power plug directly", "Turn off the wall switch first", "Close programs, Shut down, turn off monitor, UPS, and wall switch", "Close the monitor only"], ans: 2 },
      { round: "Unit 2: Computer Lab Safety", q: "What is a good distance between your eyes and the computer screen?", opts: ["2 to 4 inches", "10 meters", "Touching the glass", "18 to 28 inches"], ans: 3 },
      { round: "Unit 2: Computer Lab Safety", q: "Sitting with a bent back for a long time can cause pain in your:", opts: ["Ears", "Backbone", "Nails", "Hair"], ans: 1 },
      { round: "Unit 2: Computer Lab Safety", q: "What does 'Reuse' mean in the 3R method for e-waste?", opts: ["Burning old parts", "Throwing broken parts in rivers", "Using old working items again or giving them to others", "Breaking monitors"], ans: 2 },
      { round: "Unit 2: Computer Lab Safety", q: "Which of these is a good password rule?", opts: ["Do not use your name or birthday", "Share your password with everyone", "Use '1234' for every account", "Write it on the monitor"], ans: 0 },
      { round: "Unit 2: Computer Lab Safety", q: "What should you do before opening a pen drive in the lab?", opts: ["Drop it on the floor", "Wash it with water", "Hide it in your bag", "Scan it for viruses"], ans: 3 },

      // --- UNIT 3: OPERATING SYSTEM AND FILE MANAGEMENT (8 Qs) ---
      { round: "Unit 3: Operating System & Files", q: "What is an Operating System?", opts: ["A plastic part of the monitor", "Software that helps manage the computer and connect user and hardware", "A type of pen drive", "A printed book"], ans: 1 },
      { round: "Unit 3: Operating System & Files", q: "Which of these is an example of an Operating System?", opts: ["MS Paint", "Google Chrome", "Windows", "Audacity"], ans: 2 },
      { round: "Unit 3: Operating System & Files", q: "What is a small picture on the screen that stands for a file or program?", opts: ["Icon", "Cable", "Socket", "Key"], ans: 0 },
      { round: "Unit 3: Operating System & Files", q: "In the file name 'kamal.docx', what is '.docx'?", opts: ["Folder name", "User name", "Password", "File extension"], ans: 3 },
      { round: "Unit 3: Operating System & Files", q: "What is a folder used for in a computer?", opts: ["To play music only", "To keep files neat and organized", "To cool the CPU", "To print pages"], ans: 1 },
      { round: "Unit 3: Operating System & Files", q: "What happens when you click the Minimize button (—) on a window?", opts: ["The computer turns off", "The file is deleted forever", "The window is hidden on the taskbar", "The keyboard locks"], ans: 2 },
      { round: "Unit 3: Operating System & Files", q: "What does the Maximize button (☐) do to a working window?", opts: ["Makes the window fill the whole screen", "Deletes the text", "Opens a new folder", "Mutes the sound"], ans: 0 },
      { round: "Unit 3: Operating System & Files", q: "Can two files have the exact same name in the same folder?", opts: ["Yes, always", "Only on Mondays", "Only if they are empty", "No, each file needs a unique name"], ans: 3 },

      // --- UNIT 4: USING MOUSE AND KEYBOARD FOR APPLICATION SOFTWARE (9 Qs) ---
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which software is used to type letters and documents?", opts: ["Audio editing software", "Word processing software", "Antivirus software", "Map app"], ans: 1 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which software is used to draw pictures on a computer?", opts: ["Calculator app", "Clock app", "Graphic / drawing software", "Browser"], ans: 2 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "What is the arrow on the computer screen called?", opts: ["Mouse pointer or cursor", "Scroll wheel", "Taskbar", "Folder"], ans: 0 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "How do you usually open a file or program icon using the mouse?", opts: ["Shake the monitor", "Press the scroll wheel ten times", "Pull the cable", "Double-click the left button"], ans: 3 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which part of the mouse helps move a page up and down?", opts: ["Left button", "Scroll wheel", "Right button", "Wire"], ans: 1 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "What is the common letter layout on a computer keyboard called?", opts: ["ABCD", "1234", "QWERTY", "XYZ"], ans: 2 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which key is used to leave a space between words?", opts: ["Space bar", "Enter key", "Caps Lock", "Esc key"], ans: 0 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which key deletes one character or space to the left of the cursor?", opts: ["Space bar", "Tab key", "Shift key", "Backspace key"], ans: 3 },
      { round: "Unit 4: Mouse, Keyboard & Software", q: "Which of these is an audio editing software mentioned in Grade 6 ICT?", opts: ["MS Word", "Audacity", "Google Chrome", "Windows"], ans: 1 },

      // --- UNIT 5: ALGORITHM AND FLOW CHARTS (7 Qs) ---
      { round: "Unit 5: Algorithms & Flow Charts", q: "What is an algorithm?", opts: ["A computer screen", "A type of mouse", "Step-by-step instructions in order to solve a problem", "A web address"], ans: 2 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "Every standard algorithm must begin with 'Start' and finish with:", opts: ["End", "Copy", "Print", "Delete"], ans: 0 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "Why must the steps of an algorithm be in the right order?", opts: ["To make the screen bright", "To save electricity", "To open a browser", "Wrong order can give the wrong result"], ans: 3 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "What is a flow chart?", opts: ["A list of songs", "A picture/diagram of algorithm steps using symbols", "A computer virus", "A password"], ans: 1 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "In a flow chart, which shape shows Start and End?", opts: ["Diamond", "Arrow", "Oval", "Triangle"], ans: 2 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "In a flow chart, which shape shows Input and Output?", opts: ["Parallelogram", "Oval", "Star", "Circle"], ans: 0 },
      { round: "Unit 5: Algorithms & Flow Charts", q: "In a flow chart, which shape shows a Process or action?", opts: ["Diamond", "Oval", "Arrow", "Rectangle"], ans: 3 },

      // --- UNIT 6: USING THE INTERNET (8 Qs) ---
      { round: "Unit 6: Using the Internet", q: "What is the Internet?", opts: ["A single computer mouse", "A large network of connected computers around the world", "A drawing program", "A printer paper"], ans: 1 },
      { round: "Unit 6: Using the Internet", q: "Which program is used to open and view web pages?", opts: ["Calculator", "Paint", "Web browser", "Clock"], ans: 2 },
      { round: "Unit 6: Using the Internet", q: "Which of these is a web browser?", opts: ["Google Chrome", "Audacity", "MS Paint", "Notepad"], ans: 0 },
      { round: "Unit 6: Using the Internet", q: "Where do you type a website address in a web browser?", opts: ["Scroll wheel", "Keyboard", "Speaker", "Address bar"], ans: 3 },
      { round: "Unit 6: Using the Internet", q: "Which of these is a search engine?", opts: ["Mozilla Firefox", "Google", "Windows", "Pen drive"], ans: 1 },
      { round: "Unit 6: Using the Internet", q: "Which browser button reloads or updates the current web page?", opts: ["Home", "Print", "Refresh", "Save"], ans: 2 },
      { round: "Unit 6: Using the Internet", q: "What is best to type in a search engine to find information easily?", opts: ["Short keywords", "Long stories", "Your password", "Random letters"], ans: 0 },
      { round: "Unit 6: Using the Internet", q: "What should you do when using the Internet at school or home?", opts: ["Click unknown links in strange emails", "Share personal details with strangers", "Keep passwords on screen", "Follow safety rules and ask teachers or parents for help"], ans: 3 }
    ];

    // Shuffle each question's options cleanly while preserving the exact right answer index
    const questions = rawQuestions.map(item => {
      const correctText = item.opts[item.ans];
      const shuffledOpts = [...item.opts];
      for (let i = shuffledOpts.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledOpts[i], shuffledOpts[j]] = [shuffledOpts[j], shuffledOpts[i]];
      }
      return {
        round: item.round,
        q: item.q,
        opts: shuffledOpts,
        ans: shuffledOpts.indexOf(correctText)
      };
    });

    let currentQIndex = 0;
    let scores = [0, 0, 0, 0];
    let teamNames = ["Team A", "Team B", "Team C", "Team D"];
    let isRevealed = false;

    function renderQuestion() {
      isRevealed = false;
      const q = questions[currentQIndex];
      
      document.getElementById("round-badge").textContent = q.round;
      document.getElementById("q-counter").textContent = `Question ${currentQIndex + 1} / ${questions.length}`;
      document.getElementById("question-text").textContent = q.q;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        const textEl = document.getElementById(`opt-text-${i}`);
        textEl.textContent = q.opts[i];
        optEl.classList.remove("dimmed", "correct-answer");
      }
    }

    function revealAnswer() {
      if (isRevealed) return;
      isRevealed = true;
      const correctAns = questions[currentQIndex].ans;

      for (let i = 0; i < 4; i++) {
        const optEl = document.getElementById(`opt-${i}`);
        if (i === correctAns) {
          optEl.classList.add("correct-answer");
        } else {
          optEl.classList.add("dimmed");
        }
      }
    }

    function nextQuestion() {
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderQuestion();
      } else {
        showWinnerModal();
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderQuestion();
      }
    }

    function addScore(teamIndex, points) {
      scores[teamIndex] += points;
      document.getElementById(`score-${teamIndex}`).textContent = scores[teamIndex];
    }

    function renameTeam(teamIndex) {
      const newName = prompt(`Enter custom name for ${teamNames[teamIndex]}:`, teamNames[teamIndex]);
      if (newName && newName.trim() !== "") {
        teamNames[teamIndex] = newName.trim();
        document.getElementById(`tname-${teamIndex}`).textContent = teamNames[teamIndex];
      }
    }

    function showWinnerModal() {
      const modal = document.getElementById("winner-modal");
      const headline = document.getElementById("winner-headline");
      const subtext = document.getElementById("winner-subtext");
      const leaderboardBody = document.getElementById("leaderboard-body");

      const teamObjects = teamNames.map((name, idx) => ({ name: name, score: scores[idx] }));
      teamObjects.sort((a, b) => b.score - a.score);

      const topScore = teamObjects[0].score;
      const winners = teamObjects.filter(t => t.score === topScore);

      if (winners.length === 1) {
        headline.textContent = `🏆 WINNER: ${winners[0].name.toUpperCase()}!`;
        subtext.textContent = `Great job with ${winners[0].score} Points!`;
      } else {
        const winnerNames = winners.map(w => w.name).join(" & ");
        headline.textContent = `🤝 IT'S A TIE!`;
        subtext.textContent = `${winnerNames} tied with ${topScore} Points!`;
      }

      leaderboardBody.innerHTML = "";
      const rankClasses = ["rank-1", "rank-2", "rank-3", "rank-4"];
      const rankLabels = ["1st Place 🥇", "2nd Place 🥈", "3rd Place 🥉", "4th Place 🎗️"];

      teamObjects.forEach((t, i) => {
        const item = document.createElement("div");
        item.className = `leaderboard-item ${rankClasses[i]}`;
        item.innerHTML = `<span>${rankLabels[i]} — ${t.name}</span><span>${t.score} pts</span>`;
        leaderboardBody.appendChild(item);
      });

      modal.style.display = "flex";
    }

    function closeWinnerModal() {
      document.getElementById("winner-modal").style.display = "none";
    }

    document.addEventListener('keydown', function(event) {
      if (event.code === 'ArrowRight') nextQuestion();
      if (event.code === 'ArrowLeft') prevQuestion();
      if (event.code === 'Space') revealAnswer();
    });

    renderQuestion();
  </script>
</body>
</html>
